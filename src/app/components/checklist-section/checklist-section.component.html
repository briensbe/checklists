<div class="section-card" [id]="'section-' + section().id" tabindex="-1">
  <!-- En-tête de section pliable accessible -->
  <button
    type="button"
    (click)="toggleCollapse.emit()"
    [attr.aria-expanded]="!isCollapsed()"
    class="section-header">
    <div class="section-title-group">
      <div class="section-icon-box">
        <svg lucideListChecks [size]="16"></svg>
      </div>
      <div>
        <h3 class="section-title">{{ section().title }}</h3>
        <p class="section-counter">{{ answeredCount() }}/{{ totalCount() }} complétés</p>
      </div>
    </div>

    <div class="section-header-right">
      <span
        class="section-status-pill"
        [class.is-complete]="isComplete()"
        [class.is-pending]="!isComplete()">
        {{ isComplete() ? 'Complet' : (totalCount() - answeredCount()) + ' en attente' }}
      </span>

      <!-- La classe dynamique va sur l'enveloppe : l'icône Lucide réécrit son propre attribut class. -->
      <span class="chevron-icon" [class.is-expanded]="!isCollapsed()" aria-hidden="true">
        <svg lucideChevronDown [size]="16"></svg>
      </span>
    </div>
  </button>

  <!-- Corps de la section -->
  @if (!isCollapsed()) {
    <div class="section-body">
      @if (items().length === 0) {
        <div class="empty-section-message">
          Aucun contrôle correspondant au filtre actif dans cette section.
        </div>
      } @else {
        @for (item of items(); track item.id) {
          <app-checklist-item [item]="item" [answer]="answers()[item.id]" [readonly]="readonly()"></app-checklist-item>
        }
      }
    </div>
  }
</div>
