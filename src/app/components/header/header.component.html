<header class="app-header">
  <div class="header-container">
    <!-- Logo & Titre -->
    <div class="header-brand">
      <div class="brand-icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h1 class="brand-title">
          {{ template()?.name || 'Audit & Contrôle' }}
        </h1>
        <p class="brand-subtitle">
          {{ template()?.description || 'Validation & Piste d\'audit' }}
        </p>
      </div>
    </div>

    <!-- Sélecteur de Modèle & Actions -->
    <div class="header-actions">
      @if (templates().length > 1) {
        <div class="template-selector">
          <label class="selector-label" for="templateSelect">Modèle :</label>
          <select 
            id="templateSelect"
            [value]="template()?.id"
            (change)="onSelectTemplate($event)"
            class="template-select">
            @for (t of templates(); track t.id) {
              <option [value]="t.id">{{ t.name }} (v{{ t.version }})</option>
            }
          </select>
        </div>
      }

      <!-- Bouton Thème Clair / Sombre (Lucide Sun / Moon) -->
      <button 
        type="button"
        (click)="themeService.toggleTheme()"
        [title]="themeService.isDarkMode() ? 'Passer en mode clair' : 'Passer en mode sombre'"
        class="btn-theme-toggle">
        @if (themeService.isDarkMode()) {
          <!-- Lucide Sun -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        } @else {
          <!-- Lucide Moon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        }
      </button>

      @if (isSaving()) {
        <div class="save-badge saving">
          <span class="badge-dot saving"></span>
          Sauvegarde...
        </div>
      } @else {
        <div class="save-badge saved">
          <span class="badge-dot saved"></span>
          Auto-sauvegardé
        </div>
      }

      <!-- Boutons d'export / import JSON -->
      <button 
        type="button"
        (click)="exportJson.emit()"
        title="Afficher le brouillon JSON (aperçu, copie ou téléchargement)" 
        class="btn-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
        <span class="hidden-mobile">Brouillon</span> JSON
      </button>

      <label 
        title="Recharger un fichier de brouillon JSON ou nouveau template" 
        class="btn-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span class="hidden-mobile">Importer</span> JSON
        <input type="file" (change)="onFileImport($event)" accept=".json" class="file-input-hidden">
      </label>

      <!-- Reset -->
      <button 
        type="button"
        (click)="resetSession.emit()"
        title="Réinitialiser le formulaire d'audit" 
        class="btn-reset">
        Reset
      </button>
    </div>
  </div>
</header>
