<header class="app-header">
  <div class="header-container">
    <!-- Logo & Titre -->
    <a routerLink="/checklists" class="header-brand">
      <div class="brand-icon-box">
        <svg lucideCircleCheckBig [size]="20"></svg>
      </div>
      <div>
        <h1 class="brand-title">Checklists Hub</h1>
        <p class="brand-subtitle">Gestion & Exécution Multi-Checklists</p>
      </div>
    </a>

    <!-- Navigation Principale -->
    <nav class="header-nav">
      <a routerLink="/checklists" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        <svg lucideClipboardCheck [size]="16"></svg>
        <span>Mes Checklists</span>
      </a>
      <a routerLink="/templates" routerLinkActive="active" class="nav-link">
        <svg lucideLayers [size]="16"></svg>
        <span>Modèles & Création</span>
      </a>
    </nav>

    <!-- Thème & Actions secondaires -->
    <div class="header-actions">
      <button
        type="button"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.isDarkMode() ? 'Passer en mode clair' : 'Passer en mode sombre'"
        [title]="themeService.isDarkMode() ? 'Passer en mode clair' : 'Passer en mode sombre'"
        class="btn-theme-toggle">
        @if (themeService.isDarkMode()) {
          <svg lucideSun [size]="16"></svg>
        } @else {
          <svg lucideMoon [size]="16"></svg>
        }
      </button>
    </div>
  </div>
</header>
