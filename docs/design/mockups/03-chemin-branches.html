<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemin à étapes — branches parallèles</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --surface-0:#faf9f5;--surface-1:#f1efe8;--surface-2:#ffffff;
  --border:rgba(31,30,29,.14);--border-strong:rgba(31,30,29,.32);--border-accent:#534AB7;
  --text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#8c8a85;
  --text-success:#0F6E56;--text-danger:#A32D2D;--text-warning:#854F0B;--text-accent:#3C3489;
  --bg-success:#E1F5EE;--bg-danger:#FCEBEB;--bg-warning:#FAEEDA;--bg-accent:#EEEDFE;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface-0:#1c1b1a;--surface-1:#262624;--surface-2:#30302e;
    --border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.32);--border-accent:#AFA9EC;
    --text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#88877f;
    --text-success:#5DCAA5;--text-danger:#F09595;--text-warning:#EF9F27;--text-accent:#CECBF6;
    --bg-success:#04342C;--bg-danger:#501313;--bg-warning:#412402;--bg-accent:#26215C;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header.mk{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:0.5px solid var(--border);padding:8px 0 12px;margin-bottom:8px}
header.mk h1{font-size:18px;font-weight:600;margin:0}
header.mk a{font-size:13px;color:var(--text-accent);text-decoration:none}
header.mk p{flex-basis:100%;margin:4px 0 0;font-size:13px;color:var(--text-secondary)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button{font:inherit;font-size:13px;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:5px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:inherit;font-size:14px;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 10px}
</style>
</head>
<body>
<main>
<header class="mk"><h1>Chemin à étapes — branches parallèles</h1><a href="index.html">← toutes les maquettes</a><p>Build et Documentation avancent en parallèle ; le go/no-go est une jonction (badge n/m) qui attend les deux branches.</p></header>
<style>
.nd{position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface-2);transition:transform .2s}
.nd:hover{transform:translate(-50%,-50%) scale(1.06)}
.lb{position:absolute;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:var(--text-secondary)}
.bd{position:absolute;top:-6px;right:-10px;font-size:11px;padding:1px 6px;border-radius:var(--radius);border:0.5px solid var(--border)}
.it{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:14px;cursor:pointer;margin-bottom:8px;background:var(--surface-2)}
.it.done{color:var(--text-muted);text-decoration:line-through}
.pill{font-size:11px;padding:2px 8px;border-radius:var(--radius);margin-left:auto}
.dep{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6)}100%{transform:translate(-50%,-50%) scale(1)}}
</style>
<div style="display:flex;gap:16px;font-size:12px;color:var(--text-secondary);padding-top:.5rem">
<span style="display:flex;align-items:center;gap:6px"><span style="width:18px;height:3px;background:#1D9E75;display:inline-block"></span>porte ouverte</span>
<span style="display:flex;align-items:center;gap:6px"><span style="width:18px;border-top:2px dashed var(--border-strong);display:inline-block"></span>en attente</span>
<span style="display:flex;align-items:center;gap:6px"><i class="ti ti-git-merge" aria-hidden="true"></i>jonction</span>
</div>
<div style="position:relative;height:220px;margin:.5rem 0" id="map">
<svg id="trail" style="position:absolute;left:0;top:0;width:100%;height:220px;overflow:visible"></svg>
</div>
<div style="background:var(--surface-1);border-radius:12px;padding:1rem 1.25rem" id="panel"></div>
<script>
const S={
prep:{n:"Préparation",ic:"ti-clipboard-list",x:8,y:105,dep:[],it:[["Ticket validé",1],["Créneau réservé",1],["Changelog rédigé",0]]},
build:{n:"Build",ic:"ti-hammer",x:30,y:50,dep:["prep"],it:[["Build vert",1],["Version taggée",1]]},
doc:{n:"Documentation",ic:"ti-book",x:41,y:165,dep:["prep"],it:[["Doc utilisateur",1],["Runbook ops",1],["FAQ support",0]]},
tests:{n:"Tests",ic:"ti-flask",x:52,y:50,dep:["build"],it:[["Tests auto OK",1],["Recette métier",1],["Tests perf",0]]},
go:{n:"Go / no-go",ic:"ti-gavel",x:74,y:105,dep:["tests","doc"],it:[["Validation PO",1],["Plan de rollback",1]]},
dep:{n:"Déploiement",ic:"ti-rocket",x:93,y:105,dep:["go"],it:[["Mise en prod",1],["Smoke tests",1],["Comm envoyée",0]]}};
const K=Object.keys(S);const st={};K.forEach(k=>st[k]=S[k].it.map(()=>false));
let sel="prep",flash=[];
const m=document.getElementById("map");
const blk=k=>S[k].it.every((x,j)=>!x[1]||st[k][j]);
const unl=k=>S[k].dep.every(d=>unl(d)&&blk(d));
const pct=k=>st[k].filter(Boolean).length/st[k].length;
function ring(p,c){const r=25,C=2*Math.PI*r;return `<svg width="56" height="56" style="position:absolute;inset:0"><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--border)" stroke-width="4"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 28 28)" style="transition:stroke-dashoffset .4s"/></svg>`}
// Liens calculés en pixels à partir de la largeur réelle (même repère que les nœuds)
function drawTrail(){const W=m.clientWidth,px=x=>x*W/100;let t="";
K.forEach(k=>S[k].dep.forEach(d=>{const a=S[d],b=S[k],ok=unl(d)&&blk(d),ax=px(a.x),bx=px(b.x),mx=(ax+bx)/2;
t+=`<path d="M${ax} ${a.y} C${mx} ${a.y},${mx} ${b.y},${bx} ${b.y}" fill="none" stroke="${ok?'#1D9E75':'var(--border-strong)'}" stroke-width="${ok?4:2}" stroke-dasharray="${ok?'0':'6 6'}"/>`}));
document.getElementById("trail").innerHTML=t}
function render(){
drawTrail();
m.querySelectorAll(".nd,.lb").forEach(e=>e.remove());
K.forEach(k=>{const s=S[k],u=unl(k),p=pct(k),full=p===1,c=full?'#1D9E75':'#7F77DD';
const d=document.createElement("div");d.className="nd";d.style.left=s.x+"%";d.style.top=s.y+"px";
d.style.border=k===sel?"2px solid var(--border-accent)":"0.5px solid var(--border)";
if(flash.includes(k))d.style.animation="pop .4s";
let badge="";if(s.dep.length>1){const n=s.dep.filter(x=>unl(x)&&blk(x)).length;badge=`<span class="bd" style="background:${n===s.dep.length?'var(--bg-success)':'var(--surface-1)'};color:${n===s.dep.length?'var(--text-success)':'var(--text-secondary)'}"><i class="ti ti-git-merge" aria-hidden="true"></i> ${n}/${s.dep.length}</span>`}
d.innerHTML=(u?ring(p,c):"")+`<i class="ti ${u?(full?'ti-check':s.ic):'ti-lock'}" style="font-size:22px;color:${u?(full?'var(--text-success)':'var(--text-primary)'):'var(--text-muted)'}" aria-hidden="true"></i>`+badge;
d.onclick=()=>{sel=k;flash=[];render()};d.setAttribute("aria-label",s.n);m.appendChild(d);
const l=document.createElement("div");l.className="lb";l.style.left=s.x+"%";l.style.top=(s.y+33)+"px";l.textContent=s.n;m.appendChild(l)});
const s=S[sel],u=unl(sel),done=st[sel].filter(Boolean).length,rb=s.it.filter((x,j)=>x[1]&&!st[sel][j]).length;
const nexts=K.filter(k=>S[k].dep.includes(sel));
let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><i class="ti ${s.ic}" style="font-size:20px" aria-hidden="true"></i><span style="font-size:16px;font-weight:500">${s.n}</span>${s.dep.length>1?'<span class="pill" style="margin-left:4px;background:var(--bg-accent);color:var(--text-accent)">jonction</span>':''}<span style="margin-left:auto;font-size:13px;color:var(--text-secondary)">${done}/${s.it.length}</span></div>`;
if(!u){h+=`<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">Cette étape attend :</div>`+s.dep.map(x=>{const ok=unl(x)&&blk(x);return `<div class="dep"><i class="ti ${ok?'ti-circle-check':'ti-hourglass'}" style="font-size:18px;color:${ok?'var(--text-success)':'var(--text-warning)'}" aria-hidden="true"></i>${S[x].n}<span style="margin-left:auto;font-size:12px;color:var(--text-secondary)">${ok?'prête':(unl(x)?'bloquants en cours':'pas encore ouverte')}</span></div>`}).join("")+`<div style="font-size:13px;color:var(--text-muted);margin-top:8px">Les items restent visibles en lecture seule :</div>`+s.it.map(x=>`<div style="font-size:13px;color:var(--text-muted);padding:2px 0">· ${x[0]}</div>`).join("")}
else{h+=s.it.map((x,j)=>`<div class="it ${st[sel][j]?'done':''}" onclick="tg(${j})"><i class="ti ${st[sel][j]?'ti-circle-check':'ti-circle'}" style="font-size:20px;color:${st[sel][j]?'var(--text-success)':'var(--text-muted)'}" aria-hidden="true"></i>${x[0]}<span class="pill" style="background:${x[1]&&!st[sel][j]?'var(--bg-danger)':'var(--surface-1)'};color:${x[1]&&!st[sel][j]?'var(--text-danger)':'var(--text-secondary)'}">${x[1]?'bloquant':'optionnel'}</span></div>`).join("");
if(rb)h+=`<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${rb} bloquant(s) avant d'ouvrir la suite</div>`;
else if(!nexts.length)h+=`<div style="font-size:13px;color:var(--text-success);margin-top:4px;display:flex;gap:6px;align-items:center"><i class="ti ti-trophy" aria-hidden="true"></i>Process terminé</div>`;
else h+=nexts.map(n=>`<div style="font-size:13px;color:${unl(n)?'var(--text-success)':'var(--text-warning)'};margin-top:4px;display:flex;gap:6px;align-items:center"><i class="ti ${unl(n)?'ti-lock-open':'ti-hourglass'}" aria-hidden="true"></i>${unl(n)?'Porte ouverte vers « '+S[n].n+' »':'« '+S[n].n+' » attend encore une autre branche'}</div>`).join("")}
document.getElementById("panel").innerHTML=h}
function tg(j){const before=K.filter(unl);st[sel][j]=!st[sel][j];flash=K.filter(k=>unl(k)&&!before.includes(k));render()}
render();
new ResizeObserver(drawTrail).observe(m);
</script>

</main>
</body>
</html>
